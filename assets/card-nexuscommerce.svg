<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" fill="none" role="img" aria-label="NexusCommerce — Multi-tenant commerce platform">
<title>NexusCommerce — Multi-tenant commerce platform</title>
<style>
.sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
.mono { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
@keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
.fade-up { opacity: 0; animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) forwards; }
.fade-in { opacity: 0; animation: fadeIn .8s ease forwards; }


@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; opacity: 1 !important; transform: none !important; }
}
</style>

<defs>
  <radialGradient id="g" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(560 0) scale(320 220)">
    <stop stop-color="#79C0FF" stop-opacity=".18"/><stop offset="1" stop-color="#79C0FF" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect x="1" y="1" width="578" height="238" rx="16" fill="#0D1117"/>
<rect x="1" y="1" width="578" height="238" rx="16" fill="url(#g)">
  <animate attributeName="opacity" values="1;.5;1" dur="6s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="578" height="238" rx="16" stroke="#30363D"/>
<rect x="1" y="1" width="578" height="238" rx="16" stroke="#79C0FF" stroke-width="1.6" stroke-linecap="round"
      stroke-dasharray="140 1492" stroke-opacity=".9">
  <animate attributeName="stroke-dashoffset" from="0" to="-1632" dur="7s" repeatCount="indefinite"/>
</rect>
<g class="fade-up" style="animation-delay:.1s">
  <rect x="28" y="26" width="44" height="44" rx="11" fill="#79C0FF" fill-opacity=".12" stroke="#79C0FF" stroke-opacity=".45"/>
  <text class="mono" x="50" y="54" font-size="17" font-weight="700" fill="#79C0FF" text-anchor="middle">$</text>
  <text class="sans" x="86" y="47" font-size="22" font-weight="700" fill="#E6EDF3" letter-spacing="-.3">NexusCommerce</text>
  <text class="sans" x="86" y="67" font-size="13.5" fill="#8B949E">Multi-tenant commerce platform</text>
  <rect x="435" y="26" width="117" height="24" rx="12" fill="#79C0FF" fill-opacity=".14"/>
  <text class="sans" x="493.5" y="42" font-size="12" font-weight="600" fill="#79C0FF" text-anchor="middle">Java · Spring</text>
</g>
<g class="fade-up" style="animation-delay:0.45s"><path d="M30 104 l5 4 -5 4" stroke="#79C0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="46" y="113" font-size="13.5" fill="#C9D1D9">Storefront + admin dashboard with JWT auth and RBAC</text></g><g class="fade-up" style="animation-delay:0.57s"><path d="M30 130 l5 4 -5 4" stroke="#79C0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="46" y="139" font-size="13.5" fill="#C9D1D9">PostgreSQL for orders, MongoDB for catalogs, linked by UUID</text></g><g class="fade-up" style="animation-delay:0.69s"><path d="M30 156 l5 4 -5 4" stroke="#79C0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text class="sans" x="46" y="165" font-size="13.5" fill="#C9D1D9">Transactional orders with inventory reservation · OpenAPI</text></g>
<g class="fade-in" style="animation-delay:.9s"><rect x="28" y="190" width="49" height="24" rx="12" fill="#79C0FF" fill-opacity=".08" stroke="#79C0FF" stroke-opacity=".3"/><text class="mono" x="52.5" y="206" font-size="11.5" fill="#E6EDF3" text-anchor="middle">Java</text><rect x="85" y="190" width="111" height="24" rx="12" fill="#79C0FF" fill-opacity=".08" stroke="#79C0FF" stroke-opacity=".3"/><text class="mono" x="140.5" y="206" font-size="11.5" fill="#E6EDF3" text-anchor="middle">Spring Boot 3</text><rect x="204" y="190" width="70" height="24" rx="12" fill="#79C0FF" fill-opacity=".08" stroke="#79C0FF" stroke-opacity=".3"/><text class="mono" x="239.0" y="206" font-size="11.5" fill="#E6EDF3" text-anchor="middle">Next.js</text><rect x="282" y="190" width="91" height="24" rx="12" fill="#79C0FF" fill-opacity=".08" stroke="#79C0FF" stroke-opacity=".3"/><text class="mono" x="327.5" y="206" font-size="11.5" fill="#E6EDF3" text-anchor="middle">PostgreSQL</text><rect x="381" y="190" width="70" height="24" rx="12" fill="#79C0FF" fill-opacity=".08" stroke="#79C0FF" stroke-opacity=".3"/><text class="mono" x="416.0" y="206" font-size="11.5" fill="#E6EDF3" text-anchor="middle">MongoDB</text></g>

</svg>
